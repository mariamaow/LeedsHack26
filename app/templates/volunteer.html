<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer | Delivery Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-light bg-white mb-4">
        <div class="container">
            <a class="navbar-brand" href="login_signup.html">
                <!-- This creates button object which I have set to the logo and will take to home page-->
                <img src="{{ url_for('static', filename='logo.png') }}" alt="us2banks Logo" height="55"> 
            </a>
            <span class="position-absolute start-50 translate-middle-x fw-bold fs-6 d-block d-md-none" style="color: #000000; top:25px">
                    Volunteer Portal
            </span>
            <span class="position-absolute start-50 translate-middle-x fw-bold fs-4 d-none d-md-block" style="color: #000000; top:20px">
                    Volunteer Portal
            </span>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- This allows me to add the buttons using bootstrap commands to align them -->
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-custom text-white px-3 ms-2" href="{{ url_for('logout') }}">Logout</a></li>
                    <!-- Example, px here would add space between border of button and text inside button so its not squished-->
                </ul>
            </div>
        </div>
    </nav>


    <div class="container">
        <h2 class="fw-bold mb-4">Open Requests</h2>
        <div id="taskList">
            </div>
    </div>


    <script>
        function loadTasks() {
            const taskList = document.getElementById('taskList');
            const db = JSON.parse(localStorage.getItem('foodRequests')) || [];

            if (db.length === 0) {
                taskList.innerHTML = '<div class="empty-state"><h3>🎉 No pending requests</h3><p>Food banks are currently stocked up!</p></div>';
                return;
            }

            // Reverse so newest is at top
            taskList.innerHTML = db.reverse().map(task => `
                <div class="card border-0 shadow-sm mb-3 task-hover" style="border-radius: 12px; overflow: hidden;">
                    <div class="card-body d-flex justify-content-between align-items-center p-4">
                        
                        <div class="d-flex align-items-center">
                            <div class="me-3" style="width: 6px; height: 50px; background-color: #ff8400; border-radius: 4px;"></div>
                            
                            <div>
                                <h5 class="fw-bold mb-1 text-dark">${task.qty}x ${task.item}</h5>
                                <small class="text-muted">
                                    <i class="far fa-clock me-1"></i> Requested at: ${task.timestamp}
                                </small>
                            </div>
                        </div>

                        <button class="btn btn-warning text-white fw-bold px-4 py-2" 
                                style="background-color: #ff8400; border: none; border-radius: 8px;"
                                onclick="acceptTask(${task.id})">
                            Accept Order
                        </button>
                        
                    </div>
                </div>
            `).join('');
        }

        function acceptTask(id) {
            let db = JSON.parse(localStorage.getItem('foodRequests')) || [];
            // Remove the task once accepted (simulating moving it to a volunteer's personal list)
            db = db.filter(t => t.id !== id);
            localStorage.setItem('foodRequests', JSON.stringify(db));
            alert("Order accepted! Check your navigation for the route.");
            loadTasks();
        }

        // LIVE UPDATE: Listen for changes in localStorage from other tabs
        window.addEventListener('storage', (e) => {
            if (e.key === 'foodRequests') {
                loadTasks();
            }
        });

        // Initial load
        loadTasks();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
